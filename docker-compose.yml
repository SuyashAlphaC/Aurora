# Owner: Member 2 — full stack (SQLite-based API)

services:
  ai:
    build: ./services/ai
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/ai/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

  api:
    build: ./services/api
    ports:
      - "8000:8000"
    env_file:
      - ./services/api/.env.docker
    environment:
      AI_SERVICE_URL: http://ai:8001
      AI_SERVICE_MOCK: "false"
      DB_PATH: /app/data/aurora.db
    volumes:
      - api-data:/app/data
    depends_on:
      ai:
        condition: service_healthy

  dashboard:
    build:
      context: ./apps/dashboard
      args:
        VITE_API_URL: http://localhost:8000
        VITE_WS_URL: ws://localhost:8000/ws/live
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  api-data:
